<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>플레이스 리포트</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/common.css?v=1">
<style>
.lead{font-size:16px;margin-top:12px;color:var(--tx2)}.lead b{color:var(--tx)}
.capbox{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.capbox .shot{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:zoom-in;max-height:520px}
.capbox .shot img{width:100%;display:block}
.capbox .cap-h{font-size:12.5px;color:var(--mute);font-weight:700;margin-bottom:8px}
@media(max-width:820px){.capbox{grid-template-columns:1fr}.capbox .shot{max-height:none}}
</style>
</head><body>
<div class="bar0"><div class="in">
  <div class="brand"><img src="/logo.svg" alt="NEWKICK"><i></i><span id="coTop">플레이스 리포트</span></div>
  <div class="act" id="staff"></div>
</div></div>
<main>
  <section class="hero">
    <div class="co" id="coName">&nbsp;</div>
    <h1>네이버 플레이스 리포트</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </section>
  <div id="list"><section class="sec"><div class="skel"></div><div class="skel" style="width:60%"></div></section></div>
  <div class="foot"><img src="/logo.svg" alt="NEWKICK"><span>모바일 검색 기준 5순위 이내 보장 (광고 제외)</span></div>
</main>
<script src="/common.js?v=1"></script>
<script>
const slug = decodeURIComponent(location.pathname.split('/')[2] || new URLSearchParams(location.search).get('c') || '');
let D = null;
async function load() {
  try {
    const r = await fetch('/api/data?c=' + encodeURIComponent(slug)); D = await r.json();
    if (!r.ok) throw new Error(D.error || '불러오지 못했어요');
    render();
  } catch (e) { $('#list').innerHTML = `<section class="sec"><div class="empty">${esc(e.message)}</div></section>`; $('#meta').textContent = ''; }
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(me => { if (me) $('#staff').innerHTML = '<a class="btn" href="/admin">관리 화면</a>'; });
}
// 회차 기간 안의 기록만 (마감 후 확인 기록은 다음 회차 것)
const ck = id => { const i = D.items.find(x => x.id === id) || {}; return D.checks.filter(c => c.item_id === id && (!i.cycle_from || c.date >= i.cycle_from) && (!i.closed_at || c.date <= i.closed_at)); };
let TAB = '';
const days = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5) + 1;
function render() {
  const t = D.today, items = D.items.filter(i => i.active), ended = D.items.filter(i => !i.active).sort((a, b) => String(b.closed_at || '').localeCompare(String(a.closed_at || '')));
  document.title = D.company.name + ' 플레이스 리포트';
  $('#coName').textContent = D.company.name; $('#coTop').textContent = D.company.name;
  const last = D.checks.map(c => c.at).filter(Boolean).sort().at(-1);
  $('#meta').textContent = `${md(t)}(${wd(t)}) 기준` + (last ? ` · 최근 확인 ${last.slice(0, 10) === t ? '오늘' : md(last.slice(0, 10))} ${last.slice(11)}` : '');
  D.items.forEach(i => { window['capOf' + i.id] = d => openCap(i.keyword + (i.round > 1 ? ' · ' + i.round + '회차' : ''), ck(i.id), d); });
  if (!TAB) TAB = items.length || !ended.length ? 'on' : 'end';
  const tabs = `<div class="seg2"><button class="${TAB === 'on' ? 'on' : ''}" onclick="TAB='on';render()">진행 중 <span>${items.length}</span></button><button class="${TAB === 'end' ? 'on' : ''}" onclick="TAB='end';render()">마감 <span>${ended.length}</span></button></div>`;
  const pick = TAB === 'on' ? items : ended;
  $('#list').innerHTML = tabs + (pick.length ? pick.map(card).join('') : `<section class="sec"><div class="empty">${TAB === 'on' ? '진행 중인 키워드가 없어요' : '마감된 키워드가 없어요'}</div></section>`);
}
function card(i) {
  const cs = ck(i.id), end = !i.active && i.closed_at ? i.closed_at : D.today, cur = cs.find(c => c.date === end), last = cs.at(-1), ref = cur || last;
  const n = !ref ? '<div class="n" style="font-size:22px;color:var(--mute)">확인 전</div>' : ref.in_top ? `<div class="n ok">${ref.rank}<small>위</small></div>` : `<div class="n out">${i.top_n}위 밖</div>`;
  const sub = !i.active ? `<div class="d eq">${ref ? md(ref.date) + ' 기준' : ''}</div>` : ref && ref !== cur ? `<div class="d eq">${md(ref.date)} 기준</div>` : '';
  const span = i.cycle_from ? Math.min(400, Math.max(14, days(i.cycle_from, end))) : 14;
  const title = !i.active ? `<span class="pill ${i.close_kind === 'done' ? 'ok' : ''}" style="margin-left:6px">${i.close_kind === 'done' ? '목표 달성 마감' : '마감'}</span>` : '<span class="pill blue" style="margin-left:6px">진행 중</span>';
  return `<section class="sec">
    <div class="ih"><div class="t"><div class="k">키워드 : ${esc(i.keyword)}${title}</div><a class="plink" href="${esc(placeLink(i))}" target="_blank" rel="noopener">플레이스 바로가기 ↗</a></div><div class="rk">${n}${sub}</div></div>
    ${progHtml(i, cs, D.today)}
    <div class="grid2 tc">
      ${top5Html(i, ref, end, '', dayChips(cs, end, span, i.top_n, 'capOf' + i.id, i.cycle_from))}
      <div class="box"><div class="bt"><span>${ref && ref.cap_key ? (ref.date === D.today ? '오늘' : md(ref.date)) + ' 검색 화면' : '검색 화면'}</span>${ref && ref.cap_key ? '<span>누르면 크게 보기</span>' : ''}</div>
        ${ref && ref.cap_key ? `<div class="capthumb" onclick="capOf${i.id}('${ref.date}')"><img src="/api/cap/${ref.cap_key}" alt="검색 화면 캡처" loading="lazy"></div>` : '<div class="sub">확인 후 표시돼요</div>'}</div>
    </div>
  </section>`;
}
document.body.insertAdjacentHTML('beforeend', CAP_MODAL);
load();
</script>
</body></html>
