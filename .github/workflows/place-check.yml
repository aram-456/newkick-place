# 네이버 플레이스 모바일 순위 체크 (GitHub 서버에서 실행)
#  - 기본: 매일 07:00 Cloudflare 타이머(newkick-cron)가 실행시킴
#  - 아래 예약은 타이머가 실패했을 때를 위한 예비 (이미 체크한 항목은 건너뜀)
# Secrets: API_URL, INGEST_TOKEN
name: place-check
on:
  schedule:
    - cron: "20 22 * * *"   # 한국 07:20 예비 실행
    - cron: "40 1 * * *"    # 한국 10:40 보충 (오류 남은 항목만)
  workflow_dispatch:
    inputs:
      ids:
        description: "항목 번호만 (쉼표, 비우면 전체)"
        default: ""
      force:
        description: "오늘 이미 체크한 항목도 다시 체크"
        default: "false"
      slot:
        description: "실행 구분 (morning / manual)"
        default: ""
concurrency:
  group: place-check-${{ inputs.ids || 'all' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt
      - name: Playwright 설치
        run: |
          pip install -r checker/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 플레이스 순위 체크 + 캡처 + 서버 저장
        working-directory: checker
        run: python -u check_place.py
        env:
          API_URL: ${{ secrets.API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ONLY_IDS: ${{ inputs.ids }}
          FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          SLOT: ${{ inputs.slot || github.event.schedule || 'manual' }}
          RUN_SOURCE: github-${{ github.event_name }}
          PYTHONUTF8: "1"
