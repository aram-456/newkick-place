# web 폴더가 바뀌면 자동으로 Cloudflare 에 반영
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy-web
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DB 표 반영 (새 표만 추가, 기존 데이터 유지)
        working-directory: web
        run: npx --yes wrangler@4 d1 execute newkick-place --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포
        working-directory: web
        run: npx --yes wrangler@4 pages deploy --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
